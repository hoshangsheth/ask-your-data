# Project metadata and tool configuration (pytest, ruff).
#   pytest -q            run tests
#   ruff check .         lint
#   ruff format .        auto-format (VS Code does this on save)

[project]
name = "ask-your-data"
version = "1.0.0"
description = "Ask business questions in plain English; a LangGraph agent writes, checks and runs the SQL."
requires-python = ">=3.11"
# Runtime dependencies. Vercel installs from this list; pip, Docker and CI use requirements.txt.
# Keep the two identical (tests/unit/test_dependencies.py checks it).
dependencies = [
    "fastapi==0.162.5",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.33",
    "SQLAlchemy==2.1.8",
    "psycopg[binary]==3.3.9",
    "langgraph==1.2.20",
    "sqlglot==30.31.0",
    "pydantic-settings",
    "google-genai==3.2.0",
    "anthropic==2.8.0",
    "openai==3.49.0",
    "pandas==3.1.1",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
    "odfpy==1.4.1",
    "pyarrow==26.0.1",
    "lxml==6.1.3",
    "python-docx==1.2.0",
    "pdfplumber==0.11.10",
    "vercel-blob==0.5.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:Dialect sqlite\\+pysqlite does \\*not\\* support Decimal objects natively",
    "ignore::SyntaxWarning:google.genai.*",  # warning inside Google's SDK, not this project
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
# E/F/W: pyflakes + pycodestyle, I: import order, B: likely bugs, UP: modern syntax, SIM: simplifications
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "B008",  # FastAPI's Depends()/Header() in default arguments is the intended pattern
    "E501",  # long lines are allowed in SQL strings and test tables
]

[tool.ruff.lint.isort]
known-first-party = ["app", "evals", "tests"]
