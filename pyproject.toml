# Project metadata and tool configuration (pytest, ruff).
#   pytest -q            run tests
#   ruff check .         lint
#   ruff format .        auto-format (VS Code does this on save)

[project]
name = "ask-your-data"
version = "1.0.0"
description = "Ask business questions in plain English; a LangGraph agent writes, checks and runs the SQL."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:Dialect sqlite\\+pysqlite does \\*not\\* support Decimal objects natively",
    "ignore::SyntaxWarning:google.genai.*",  # warning inside Google's SDK, not this project
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
# E/F/W: pyflakes + pycodestyle, I: import order, B: likely bugs, UP: modern syntax, SIM: simplifications
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "B008",  # FastAPI's Depends()/Header() in default arguments is the intended pattern
    "E501",  # long lines are allowed in SQL strings and test tables
]

[tool.ruff.lint.isort]
known-first-party = ["app", "evals", "tests"]
