# Local stack: PostgreSQL 16 + the app.
#   docker compose up --build     start (first run seeds the demo data)
#   docker compose down -v        stop and delete the database volume
# Put your AI provider settings (LLM_PROVIDER, GEMINI_API_KEY, ...) in .env; it is loaded below.

services:
  # Database. The init script creates a SELECT-only role used for model-generated SQL.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-readonly.sql:/docker-entrypoint-initdb.d/01-readonly.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d shop"]
      interval: 3s
      retries: 20

  # API + dashboard on http://localhost:8000
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/shop                         # owner: seeding only
      READONLY_DATABASE_URL: postgresql+psycopg://app_readonly:readonly@db:5432/shop  # runs generated SQL
    command: sh -c "python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

volumes:
  pgdata:
